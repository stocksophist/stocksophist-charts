<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockSophist Charts</title>
<style>
  /* ============================================================
     StockSophist design tokens - visual redesign.
     3 layers: primitive palette -> semantic tokens -> components.
     Themes switch by setting data-theme on <html>; persisted in
     localStorage. Research notes: warm-tinted dark gray for long
     sessions (cool blue-grays fatigue faster), off-white #ECECEC
     text (no halation), hairline borders, 8pt spacing, 150-200ms
     motion on transform/opacity only.*/
  :root {
    --font-ui: system-ui, "Segoe UI", -apple-system, Roboto, "Helvetica Neue", sans-serif;
    --font-num: system-ui, "Segoe UI", -apple-system, Roboto, sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    --radius-s: 4px; --radius-m: 6px; --radius-l: 8px; --radius-xl: 12px;
    --ease: cubic-bezier(.2,.7,.3,1);
    --t-hover: 160ms; --t-press: 120ms;
    --shadow-pop: 0 8px 28px rgba(0,0,0,.45);
    --shadow-float: 0 4px 16px rgba(0,0,0,.4);
  }
  /* -- warm dark: default, soothing for long sessions ---- */
  [data-theme="warm"], :root:not([data-theme]) {
    color-scheme: dark;
    --bg-base: #141216; --bg-panel: #1c1920; --bg-elev: #242028; --bg-hover: #2b2632;
    --bg-input: #100e13; --bg-inset: #0d0b10;
    --border: #2b2733; --border-strong: #3a3444; --border-soft: #221f29;
    --text-1: #ececec; --text-2: #b3aea8; --text-3: #7d776f; --text-bright: #ffffff;
    --accent: #6f9bff; --accent-hover: #5a86f0; --accent-soft: rgba(111,155,255,.14);
    --accent-text: #ffffff;
    --up: #2ebd85; --down: #f6465d;
    --up-soft: rgba(46,189,133,.13); --down-soft: rgba(246,70,93,.13);
    --warn: #f0b429; --warn-soft: rgba(240,180,41,.13);
    --ok: #2ebd85;
    --chart-bg: #141216; --chart-text: #8a857e; --chart-grid: rgba(236,236,236,.055);
    --chart-border: #2b2733; --chart-cross: #6f9bff;
    --candle-up: #2ebd85; --candle-down: #f6465d;
    --row-hover: #232028; --row-active: #252b45;
  }
  /* -- oled: true black ---- */
  [data-theme="oled"] {
    color-scheme: dark;
    --bg-base: #000000; --bg-panel: #0b0b0c; --bg-elev: #141415; --bg-hover: #1d1d1f;
    --bg-input: #000000; --bg-inset: #060607;
    --border: #222224; --border-strong: #333336; --border-soft: #161617;
    --text-1: #ececec; --text-2: #a7a7ab; --text-3: #6e6e73; --text-bright: #ffffff;
    --accent: #5b8cff; --accent-hover: #4a7bef; --accent-soft: rgba(91,140,255,.16);
    --accent-text: #ffffff;
    --up: #0ecb81; --down: #f6465d;
    --up-soft: rgba(14,203,129,.13); --down-soft: rgba(246,70,93,.13);
    --warn: #f0b90b; --warn-soft: rgba(240,185,11,.13);
    --ok: #0ecb81;
    --chart-bg: #000000; --chart-text: #6e6e73; --chart-grid: rgba(255,255,255,.05);
    --chart-border: #222224; --chart-cross: #5b8cff;
    --candle-up: #0ecb81; --candle-down: #f6465d;
    --row-hover: #141415; --row-active: #1a2340;
  }
  /* -- light: clean day theme ---- */
  [data-theme="light"] {
    color-scheme: light;
    --bg-base: #eef0f4; --bg-panel: #ffffff; --bg-elev: #ffffff; --bg-hover: #f0f2f6;
    --bg-input: #f6f8fa; --bg-inset: #e8ebf0;
    --border: #e0e4ea; --border-strong: #c9cfd8; --border-soft: #eceff4;
    --text-1: #1c1f26; --text-2: #5b6270; --text-3: #8a93a3; --text-bright: #000000;
    --accent: #2962ff; --accent-hover: #1e4fd1; --accent-soft: rgba(41,98,255,.1);
    --accent-text: #ffffff;
    --up: #089981; --down: #f23645;
    --up-soft: rgba(8,153,129,.12); --down-soft: rgba(242,54,69,.1);
    --warn: #b7791f; --warn-soft: rgba(183,121,31,.12);
    --ok: #089981;
    --chart-bg: #ffffff; --chart-text: #8a93a3; --chart-grid: rgba(28,31,38,.06);
    --chart-border: #e0e4ea; --chart-cross: #2962ff;
    --candle-up: #089981; --candle-down: #f23645;
    --row-hover: #f0f2f6; --row-active: #e8eefc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg-base); color: var(--text-1);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* -------- top bar ---------- */
  #topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  /* --------bar-replay ---------- */
  #btn-replay.on { color: var(--accent); border-color: var(--accent); }
  /* ---------- v3.4.41 zoom-sync ---------- */
  #btn-zoom.on { color: var(--accent); border-color: var(--accent); }
  .zoomsel {
    position: absolute; z-index: 60; pointer-events: none;
    border: 1px solid var(--accent); background: rgba(88, 166, 255, .15);
  }
  #replaybar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: none; align-items: center; gap: 6px; z-index: 1000;
    background: var(--bg-panel); border: 1px solid var(--border-strong);
    border-radius: 10px; padding: 8px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.5);
  }
  #replaybar .rp-badge {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    color: #fff; background: var(--accent); border-radius: 4px; padding: 3px 8px;
    margin-right: 4px; user-select: none;
  }
  #replaybar button.rp {
    background: transparent; border: 1px solid transparent; color: var(--text-bright);
    border-radius: 6px; padding: 6px; cursor: pointer; display: flex; align-items: center;
  }
  #replaybar button.rp:hover { background: var(--bg-hover); border-color: var(--border); }
  #replaybar button.rp.on { color: var(--accent); border-color: var(--accent); }
  #replaybar select {
    background: var(--bg-input); color: var(--text-bright);
    border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 6px; font-size: 12px;
  }
  #rp-clock {
    font-size: 12px; color: var(--text-bright); font-variant-numeric: tabular-nums;
    min-width: 158px; text-align: center; user-select: none;
  }
  #replaybar .rp-live {
    font-size: 12px; font-weight: 600; color: var(--text-bright);
    background: transparent; border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; margin-left: 4px;
  }
  #replaybar .rp-live:hover { border-color: var(--accent); color: var(--accent); }
  body.replay-picking .chartwrap { cursor: crosshair; }
  body.replay-picking .chartwrap::after {
    content: "Click a bar to start replay - Esc cancels";
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--accent); color: var(--text-bright);
    font-size: 12px; padding: 6px 12px; border-radius: 6px; z-index: 50;
    pointer-events: none; white-space: nowrap;
  }
  body.zoom-armed .chartwrap { cursor: crosshair; }
  body.zoom-armed .chartwrap::after {
    content: "Drag a box - every chart zooms to that time range - Esc cancels";
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: var(--bg-panel); border: 1px solid var(--accent); color: var(--text-bright);
    font-size: 12px; padding: 6px 12px; border-radius: 6px; z-index: 50;
    pointer-events: none; white-space: nowrap;
  }
  .brand { font-weight: 700; font-size: 14px; color: var(--text-bright); white-space: nowrap; }
  .brand span { color: var(--accent); }
  .brand em { font-style: normal; font-weight: 400; font-size: 11px; color: var(--text-3); margin-left: 4px; }
  .tbtn {
    background: var(--border); color: var(--text-1); border: 1px solid var(--border-strong);
    border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
    white-space: nowrap; position: relative;
  }
  .tbtn:hover { border-color: var(--accent); }
  .tbtn.on { background: var(--accent); border-color: var(--accent); color: var(--text-bright); }
  .tbtn.degraded { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  #btn-hist.busy { border-color: var(--accent); color: var(--accent); animation: histpulse 1.6s ease-in-out infinite; }
  @keyframes histpulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .tbtn .cnt {
    position: absolute; top: -7px; right: -7px; background: var(--down); color: var(--text-bright);
    font-size: 10px; font-weight: 700; border-radius: 9px; padding: 1px 6px; display: none;
  }
  .tbtn .cnt.show { display: inline-block; }
  #save-state { margin-left: auto; font-size: 11px; color: var(--ok); opacity: 0; transition: opacity .4s; }
  /* unsaved-changes dot on the Save button */
  #btn-savelayout.dirty::after {
    content: ""; position: absolute; top: -4px; right: -4px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--warn); box-shadow: 0 0 6px rgba(255,152,0,.9);
  }
  /* -------- main ---------- */
  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  #drawbar {
    flex: 0 0 46px; background: var(--bg-panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 10px;
  }
  #drawbar button {
    width: 34px; height: 34px; padding: 0; font-size: 16px;
    background: var(--border); color: var(--text-1); border: 1px solid var(--border-strong); border-radius: 4px; cursor: pointer;
  }
  #drawbar button.on { background: var(--accent); border-color: var(--accent); color: var(--text-bright); }
  #drawbar button:hover { border-color: var(--accent); }
  #drawbar button svg { vertical-align: -3px; pointer-events: none; }
  #drawbar .hint { font-size: 9px; color: var(--text-3); text-align: center; line-height: 1.4; margin-top: 6px; }
  /* -------- watchlist ---------- */
  #watchlist {
    flex: 0 0 auto; width: 240px; background: var(--bg-panel); border-right: 1px solid var(--border);
    display: none; flex-direction: column; min-height: 0; position: relative;
  }
  #watchlist.open { display: flex; }
  /* drag handle: resize the whole watchlist window */
  #wl-resize {
    position: absolute; top: 0; right: -4px; width: 9px; bottom: 0;
    cursor: ew-resize; z-index: 5;
  }
  #wl-resize:hover, #wl-resize.on { background: color-mix(in srgb, var(--accent) 35%, transparent); }
  #watchlist .wl-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text-bright);
  }
  #watchlist .wl-head button {
    background: var(--accent); color: var(--text-bright); border: 0; border-radius: 4px;
    font-size: 14px; width: 24px; height: 24px; cursor: pointer; line-height: 1;
  }
  #watchlist .wl-cols, #watchlist .wl-row {
    display: grid;
    grid-template-columns: minmax(var(--wlw0, 90px), 1fr) var(--wlw1, 64px) var(--wlw2, 64px) 56px;
    gap: 4px; padding: 5px 10px; font-size: 12px; align-items: center;
  }
  #watchlist .wl-cols > span { position: relative; }
  /* drag handle: resize an individual column */
  #watchlist .wl-div {
    position: absolute; top: -5px; bottom: -5px; right: -6px; width: 11px;
    cursor: col-resize; z-index: 3;
  }
  #watchlist .wl-div:hover, #watchlist .wl-div.on { background: color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 3px; }
  #watchlist .wl-cols { color: var(--text-3); font-size: 10px; border-bottom: 1px solid var(--border); }
  #watchlist .wl-cols span:nth-child(n+2), #watchlist .wl-row span:nth-child(n+2) { text-align: right; }
  #watchlist .wl-body { overflow-y: auto; flex: 1 1 auto; }
  #watchlist .wl-row { cursor: pointer; border-bottom: 1px solid var(--border-soft); position: relative; }
  #watchlist .wl-row:hover { background: var(--row-hover); }
  #watchlist .wl-row.wl-active { background: var(--row-active); box-shadow: inset 2px 0 0 var(--accent); }
  #watchlist .wl-row .sym { color: var(--text-bright); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #watchlist .wl-row .last { color: var(--text-1); }
  #watchlist .wl-row .up { color: var(--up); } #watchlist .wl-row .dn { color: var(--down); }
  .wl-pick { padding: 7px 10px; cursor: pointer; border-bottom: 1px solid var(--border-soft); color: var(--text-1); }
  .wl-pick:hover { background: var(--row-hover); color: var(--text-bright); }
  .wl-pick.disabled { cursor: default; color: var(--text-3); }
  .wl-pick.disabled:hover { background: none; color: var(--text-3); }
  #watchlist .wl-row .rm {
    display: none; position: absolute; right: 2px; top: 2px; background: var(--down); color: var(--text-bright);
    border: 0; border-radius: 3px; font-size: 10px; padding: 1px 6px; cursor: pointer;
  }
  #watchlist .wl-row:hover .rm { display: block; }
  #watchlist .wl-foot { padding: 6px 10px; font-size: 10px; color: var(--text-3); border-top: 1px solid var(--border); }
  /* -------- grid / panes ---------- */
  #grid { flex: 1 1 auto; display: grid; gap: 4px; padding: 4px; min-width: 0; min-height: 0; }
  .pane {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: var(--bg-base);
  }
  .pane.active { border-color: var(--accent); }
  .pane-bar {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border); flex: 0 0 auto; flex-wrap: wrap;
  }
  .pane-bar input.sym {
    width: 76px; background: var(--bg-base); color: var(--text-bright); border: 1px solid var(--border-strong);
    border-radius: 4px; padding: 3px 6px; font-size: 12px;
  }
  .pane-bar select.tf, .pane-bar button.fxbtn {
    background: var(--bg-base); color: var(--text-1); border: 1px solid var(--border-strong);
    border-radius: 4px; padding: 3px 6px; font-size: 12px; cursor: pointer;
  }
  .pane-bar button.fxbtn.on { background: var(--accent); border-color: var(--accent); color: var(--text-bright); }
  /* Favourite timeframes (chart-style): starred TFs sit on the bar,
     the full list lives behind the v menu with star toggles.*/
  .tffavs { display: flex; align-items: center; gap: 2px; }
  .tfbtn {
    background: transparent; color: var(--text-3); border: 1px solid transparent;
    border-radius: 4px; padding: 3px 7px; font-size: 12px; cursor: pointer;
  }
  .tfbtn:hover { background: var(--border); color: var(--text-1); }
  .tfbtn.on { background: var(--accent); color: var(--text-bright); font-weight: 600; }
  .tfmenu {
    background: var(--bg-base); color: var(--text-1); border: 1px solid var(--border-strong);
    border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer;
  }
  .tfmenu:hover { background: var(--border); }
  /* Go-to-date calendar */
  .calbtn {
    background: var(--bg-base); color: var(--text-1); border: 1px solid var(--border-strong);
    border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer;
  }
  .calbtn:hover { background: var(--border); }
  .gotodate-pop {
    position: fixed; z-index: 1000; background: var(--bg-panel);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); width: 220px;
  }
  .gotodate-pop .gtd-title { font-size: 13px; font-weight: 600; color: var(--text-bright); margin-bottom: 8px; }
  .gotodate-pop .gtd-input {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border-strong);
    color: var(--text-bright); border-radius: 4px; padding: 6px 8px; font-size: 13px;
    margin-bottom: 10px; box-sizing: border-box; color-scheme: dark;
  }
  .gotodate-pop .gtd-row { display: flex; gap: 8px; }
  .gotodate-pop .gtd-go, .gotodate-pop .gtd-cancel {
    flex: 1; padding: 6px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid var(--border-strong);
  }
  .gotodate-pop .gtd-go { background: var(--accent); color: var(--text-bright); border-color: var(--accent); }
  .gotodate-pop .gtd-cancel { background: var(--bg-base); color: var(--text-1); }
  .tfpop {
    position: fixed; z-index: 1000; min-width: 190px; max-height: 320px; overflow-y: auto;
    background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 4px;
  }
  .tfpop .tfrow {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: 4px; cursor: pointer; font-size: 12px; color: var(--text-1);
  }
  .tfpop .tfrow:hover { background: var(--border); }
  .tfpop .tfrow.cur { color: var(--text-bright); font-weight: 600; }
  .tfpop .tfrow .tfl { flex: 1; }
  .tfpop .tfrow .star {
    background: none; border: 0; cursor: pointer; font-size: 14px;
    color: var(--text-3); padding: 0 2px; line-height: 1;
  }
  .tfpop .tfrow .star.fav { color: var(--warn); }
  .tfpop .tfrow .star:hover { color: var(--warn); }
  .tfpop .tfgroup {
    font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em;
    padding: 8px 8px 2px;
  }
  /* Telegram Alerts settings section */
  .mbox.tgrw { max-width: 640px; }
  .tgr-whbox {
    display: flex; align-items: center; gap: 8px; background: var(--bg-base);
    border: 1px solid var(--border-strong); border-radius: 4px; padding: 6px 10px; margin: 4px 0;
  }
  .tgr-whbox code { flex: 1; color: var(--ok); font-size: 12px; word-break: break-all; }
  .tgr-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tgr-inds { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin: 4px 0 8px; }
  .tgr-ind { margin: 2px 0 !important; font-size: 12px; }
  .tgr-ch { margin: 8px 0; border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; }
  .tgr-ch summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-1); }
  .tgr-ch input { font-family: monospace; font-size: 11px; }
  .tgr-log {
    max-height: 180px; overflow-y: auto; background: var(--bg-inset);
    border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; margin-top: 4px;
  }
  .rlog { font-size: 11px; color: var(--text-1); padding: 2px 0; border-bottom: 1px solid var(--bg-panel); }
  .rlog .rt { color: var(--text-3); font-family: monospace; }
  .rlog .rk { font-weight: 700; font-size: 10px; padding: 0 4px; border-radius: 3px; background: var(--border); }
  .rlog .rk-sent { background: var(--up-soft); color: var(--ok); }
  .rlog .rk-failed, .rlog .rk-router_error { background: var(--down-soft); color: var(--down); }
  .rlog .rk-duplicate, .rlog .rk-skipped, .rlog .rk-ignored { background: var(--warn-soft); color: var(--warn); }
  .rlog .rk-queued, .rlog .rk-callback { background: var(--accent-soft); color: var(--accent); }
  .rlog .rp { color: var(--text-3); }
  /* BUY/SELL signal explanation tooltip (hover a marker bar) */
  .signaltip {
    position: absolute; z-index: 60; max-width: 340px;
    background: rgba(19, 23, 34, 0.97); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 8px 10px; pointer-events: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  .signaltip .st-head { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .signaltip .st-head.buy { color: var(--up); }
  .signaltip .st-head.sell { color: var(--down); }
  .signaltip .st-body {
    font-size: 11px; color: var(--text-1); white-space: pre-wrap; word-break: break-word;
    font-family: monospace; line-height: 1.5;
  }
  /* feed-health pill (topbar) + news-marker hover tooltip (per pane).
     The health pill mirrors the Hist pill pattern; colors: green = healthy,
     amber = stale/degraded, red = down.*/
  .hpill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--border); border: 1px solid var(--border-strong);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--text-1);
    white-space: nowrap; cursor: default;
  }
  .hpill .hdot { width: 9px; height: 9px; border-radius: 50%; background: #888; display: inline-block; }
  .hpill.hp-ok .hdot { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .hpill.hp-warn .hdot { background: #ff9800; box-shadow: 0 0 6px #ff9800; }
  .hpill.hp-bad .hdot { background: #ef5350; box-shadow: 0 0 6px #ef5350; }
  .newstip {
    position: absolute; z-index: 60; max-width: 300px;
    background: rgba(19, 23, 34, 0.97); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 8px 10px; pointer-events: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  .newstip .nt-head { font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--text-bright); }
  .newstip .nt-body { font-size: 11px; color: var(--text-1); line-height: 1.5; }

    background: rgba(41,98,255,.12); border-radius: 4px; text-align: center; padding: 2px 0;
  }
  #news-panel .nw-dot { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
  #news-panel .nw-dot.High { background: #ef5350; box-shadow: 0 0 6px rgba(239,83,80,.7); }
  #news-panel .nw-dot.Medium { background: #ff9800; }
  #news-panel .nw-dot.Low { background: #9e9e9e; }
  #news-panel .nw-dot.Holiday { background: #64b5f6; }
  #news-panel .nw-title { color: var(--text-bright); font-size: 11.5px; line-height: 1.35; }
  #news-panel .nw-title small { display: block; color: var(--text-3); font-size: 10px; margin-top: 1px; }
  #news-panel .nw-cd { text-align: right; font-size: 10.5px; color: var(--text-2); }
  #news-panel .nw-cd.soon { color: #ffb74d; font-weight: 700; }
  #news-panel .nw-row.past { opacity: .42; }
  #news-panel .nw-row.past .nw-cd { color: var(--text-3); font-weight: 400; }
  #news-panel .nw-row.next { border-left-color: var(--accent); background: rgba(41,98,255,.07); }
  #news-panel .nw-foot {
    padding: 6px 10px; border-top: 1px solid var(--border);
    font-size: 10px; color: var(--text-3); display: flex; gap: 10px; align-items: center;
  }
  #news-panel .nw-foot .lg { display: inline-flex; align-items: center; gap: 4px; }
  #news-panel .nw-foot .sw { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* ============ redesign: icons, type, motion, focus ============ */
  body { font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
  /* tabular numerals everywhere numbers tick (research: highest-leverage
     typography change in a trading UI - digits never shift width)*/
  .quote, .wl-row, .wl-cols, .pane-bar, .legend, .ilib-row, .signaltip,
  .badge, .stale, .hist, .tbtn, .gotodate-pop { font-variant-numeric: tabular-nums; }
  /* icon buttons: svg + label aligned, generous hit area */
  .tbtn.icobtn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; min-height: 32px; }
  .tbtn.icobtn svg { width: 15px; height: 15px; flex: 0 0 auto; opacity: .85; }
  .tbtn.iconly { width: 34px; height: 32px; padding: 0; display: inline-flex;
                 align-items: center; justify-content: center; }
  .tbtn.iconly svg { width: 16px; height: 16px; }
  #drawbar button { display: inline-flex; align-items: center; justify-content: center;
                    width: 38px; height: 38px; }
  #drawbar button svg { width: 18px; height: 18px; }
  /* motion: one easing family, transform/opacity only, research timings */
  .tbtn, #drawbar button, .tfbtn, .tfmenu, .calbtn, .ilib-row, .wl-row, .tfpop .tfrow,
  .gtd-floatbtn, .ap-tab, .seg button {
    transition: background-color var(--t-hover) var(--ease),
                border-color var(--t-hover) var(--ease),
                color var(--t-hover) var(--ease),
                transform var(--t-press) var(--ease),
                box-shadow var(--t-hover) var(--ease);
  }
  .tbtn:active, #drawbar button:active, .tfbtn:active { transform: scale(.96); }
  /* visible keyboard focus (never outline:none without replacement) */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  /* softer pane chrome */
  .pane { border-radius: var(--radius-m); box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .pane-bar { padding: 6px 10px; gap: 8px; }
  #topbar { padding: 8px 14px; gap: 8px; }
  #drawbar { flex-basis: 52px; gap: 8px; padding-top: 12px; }
  /* respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }
</style>
</head>
<body>
  <!--startup sync overlay - shows what the server is doing
       (MT5 connect -> history sync -> live) instead of a blank chart. -->
  <div id="sync-overlay" style="position:fixed;inset:0;z-index:9999;background:var(--bg-inset);
       display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px">
    <div style="color:var(--text-1);font-size:18px;font-weight:700">STOCKSOPHIST <span style="color:var(--accent)">CHARTS</span></div>
    <div class="spin" style="width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%"></div>
    <div id="sync-msg" style="color:var(--text-2);font-size:13px;max-width:420px;text-align:center">Connecting to server...</div>
    <div id="sync-steps" style="color:#8b98ab;font-size:12px"></div>
    <!--per-operation live progress (what / how long / stuck / error)-->
    <div id="sync-ops" style="display:flex;flex-direction:column;gap:6px;max-width:440px;width:90%"></div>
    <div id="sync-sub" style="color:#5a5e6a;font-size:11px"></div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}.spin{animation:spin 1s linear infinite}
  /* honest indeterminate progress - used when the server can't measure real % */
  @keyframes opbar{0%{margin-left:-30%}100%{margin-left:100%}}.opbar{animation:opbar 1.4s linear infinite}</style>
  <div id="topbar">
    <div class="brand">STOCKSOPHIST <span>CHARTS</span><em id="ver">v3.0</em></div>
    <div id="profile-wrap" style="position:relative">
      <button class="tbtn icobtn" id="btn-profile" data-ic="grid" title="Chart profile - click to switch"><span id="profile-name">Default</span></button>
      <div id="profile-dropdown" style="display:none;position:absolute;top:100%;left:0;z-index:300;background:var(--bg-panel);border:1px solid var(--border-strong);border-radius:6px;min-width:220px;max-height:300px;overflow-y:auto;box-shadow:0 6px 24px rgba(0,0,0,.5)">
        <div id="profile-list"></div>
        <div style="border-top:1px solid var(--border);padding:8px">
          <div style="display:flex;gap:6px">
            <input id="profile-newname" placeholder="New profile name..." style="flex:1;background:var(--bg-input);border:1px solid var(--border-strong);color:var(--text-bright);border-radius:4px;padding:6px 8px;font-size:12px">
            <button class="btn sm primary" id="profile-create">Add</button>
          </div>
        </div>
      </div>
    </div>
    <!-- the 1/2/3/4-chart grid picker hides behind a double-click
         on the profile button - it gets its own button. -->
    <button class="tbtn icobtn" id="btn-layout" data-ic="grid" title="Chart layout - 1, 2, 3 or 4 charts side by side">Layout</button>
    <button class="tbtn icobtn" id="btn-savelayout" data-ic="save" title="Save layout now - orange dot means unsaved changes (auto-saves every 60s)">Save</button>
    <button class="tbtn on" id="btn-syncdrawings" title="Sync drawings - a drawing on one chart appears on all charts of the same symbol">Sync drawings</button>
    <button class="tbtn icobtn" id="btn-watch" data-ic="watchlist" title="Watchlist">Watchlist</button>
    <button class="tbtn" id="btn-mt5" title="MT5 connection settings">MT5</button>
    <button class="tbtn icobtn" id="btn-data" data-ic="data" title="Backfill history / backup / restore">Data</button>
    <button class="tbtn icobtn" id="btn-heal" data-ic="heal" title="Fix missing candles - rescan for gaps and backfill from MT5">Fix data</button>
    <button class="tbtn" id="btn-hist" title="Deep history - maximum MT5 data with progress">Hist</button>
    <!--feed-health pill - green = stream up & quotes fresh, amber =
         stale/degraded, red = down. Hover for the full /api/health snapshot. -->
    <span class="hpill" id="health-pill" title="Feed health - loading..."><span class="hdot"></span><span id="health-txt">Feed</span></span>
    <button class="tbtn icobtn" id="btn-tg" data-ic="send" title="Telegram alert settings">Telegram</button>
    <button class="tbtn icobtn" id="btn-trade" data-ic="zap" title="Chart trading (MT5)">Trade</button>
    <button class="tbtn icobtn" id="btn-news" data-ic="news" title="Economic calendar - today's news events (IST)">News</button>
    <!--news-marker toggle - USD High/Medium markers on all charts.
         Pure display; the existing News button above opens the calendar panel. -->
    <button class="tbtn" id="btn-newsmarks" title="USD news markers on all charts - red = High impact, gold = Medium (display only)">News*</button>
    <button class="tbtn icobtn" id="btn-replay" data-ic="replay" title="Bar replay - step through history bar by bar">Replay</button>
    <button class="tbtn" id="btn-zoom" title="Zoom-sync - drag a box on any chart; every chart zooms to that time range (each chart keeps its own timeframe)">Zoom</button>
    <button class="tbtn iconly" id="btn-chartset" data-ic="gear" title="Chart / canvas settings"></button>
    <button class="tbtn iconly" id="btn-theme" title="Switch theme"></button>
    <div id="save-state">&#10003; saved</div>
    <button class="tbtn" id="reset-layout" title="Clear saved layout and drawings">Reset</button>
  </div>
  <!--bar-replay control bar-->
  <div id="replaybar" style="display:none">
    <span class="rp-badge">REPLAY</span>
    <button class="rp" data-rp="start" title="Jump to first loaded bar"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19 5.5v13l-9.5-6.5z" fill="currentColor"/></svg></button>
    <button class="rp" data-rp="back" title="Step back one bar"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M18.5 5.5v13L10 12z" fill="currentColor"/></svg></button>
    <button class="rp" data-rp="play" id="rp-play" title="Play (auto-play)"></button>
    <button class="rp" data-rp="fwd" title="Step forward one bar"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5.5 5.5v13L14 12z" fill="currentColor"/><path d="M18 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <select id="rp-speed" title="Replay speed (bars per second)">
      <option value="1">1 bar/s</option>
      <option value="2">2 bars/s</option>
      <option value="5" selected>5 bars/s</option>
      <option value="10">10 bars/s</option>
      <option value="20">20 bars/s</option>
    </select>
    <span id="rp-clock" title="Replay cursor time (IST)"></span>
    <button class="rp-live" data-rp="live" title="Exit replay and return to the live chart">Go live</button>
  </div>
  <div id="main">
    <div id="profile-badge" style="position:absolute;top:52px;left:52px;z-index:100;background:rgba(28,34,48,.9);border:1px solid var(--accent);border-radius:6px;padding:4px 12px;font-size:12px;color:var(--text-bright);pointer-events:none"> <span id="profile-badge-name">Default</span></div>
    <div id="drawbar">
      <button data-tool="cursor" class="on" title="Select / move (V or M)"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5.2 3.4 19.4 11.8l-8 1.6-2.9 7.9z" fill="currentColor" stroke="#0b0e14" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
      <button data-tool="cross" title="Crosshair" data-ic="cross"></button>
      <button data-tool="trend" title="Trend line" data-ic="trend"></button>
      <button data-tool="ray" title="Ray" data-ic="ray"></button>
      <button data-tool="hline" title="Horizontal line" data-ic="hline"></button>
      <button data-tool="hray" title="Horizontal ray" data-ic="hray"></button>
      <button data-tool="vline" title="Vertical line" data-ic="vline"></button>
      <button data-tool="rect" title="Rectangle" data-ic="rect"></button>
      <button data-tool="ellipse" title="Ellipse" data-ic="ellipse"></button>
      <button data-tool="fib" title="Fib retracement" data-ic="fib"></button>
      <button data-tool="long" title="Long position"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 16.5v-9M8.2 11.2 12 7.5l3.8 3.7" fill="none" stroke="var(--up)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button data-tool="short" title="Short position"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v9M8.2 12.8 12 16.5l3.8-3.7" fill="none" stroke="var(--down)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button data-tool="tradetaker" title="Trade Taker - plan and place a risk-sized trade"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="var(--accent)" stroke-width="1.8"/><circle cx="12" cy="12" r="1.6" fill="var(--accent)"/></svg></button>
      <button data-tool="text" title="Text label" data-ic="text"></button>
      <button data-tool="eraser" title="Eraser" data-ic="eraser"></button>
      <div class="hint">Esc<br>cancel<br><br>Del<br>delete</div>
    </div>
    <div id="watchlist">
      <div class="wl-head"><span>Watchlist</span><span style="display:flex;gap:6px"><button id="wl-sync" data-ic="sync" title="Sync with MT5 Market Watch"></button><button id="wl-add" title="Add symbol">+</button></span></div>
      <div class="wl-cols"><span>Symbol</span><span>Last</span><span>Chg</span><span>Chg%</span></div>
      <div class="wl-body" id="wl-body"></div>
      <div class="wl-foot" id="wl-foot"></div>
    </div>
    <div id="grid"></div>
    <div id="alertbar">
      <button id="alertbar-btn" title="Alerts"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="cnt" id="alertbar-cnt"></span></button>
    </div>
  </div>
  <div id="alertpanel">
    <div class="ap-head">
      <div class="ap-tabs">
        <button class="ap-tab on" data-tab="alerts">Alerts</button>
        <button class="ap-tab" data-tab="log">Log</button>
      </div>
      <button class="ap-x" id="ap-close" title="Close">&times;</button>
    </div>
    <div class="ap-toolbar" id="ap-alerts-tools">
      <input id="ap-search" placeholder="Search alerts..." autocomplete="off">
      <div class="ap-chips">
        <button class="ap-chip on" data-f="all">All</button>
        <button class="ap-chip" data-f="active">Active</button>
        <button class="ap-chip" data-f="stopped">Stopped</button>
      </div>
      <div class="ap-row2">
        <select id="ap-sort">
          <option value="newest">Newest first</option>
          <option value="name">Name</option>
          <option value="symbol">Symbol</option>
        </select>
        <button class="btn" id="ap-add">+ New alert</button>
      </div>
    </div>
    <div class="ap-toolbar" id="ap-log-tools">
      <a class="btn" id="ap-csv" href="/api/alerts/log.csv" download>Export CSV</a>
      <button class="btn" id="ap-clearlog">Clear log</button>
    </div>
    <div class="ap-list" id="ap-list"></div>
  </div>
  <div id="toast"></div>
  <div id="alert-stack"></div>
  <div id="ctxmenu"></div>
  <div id="modal-root"><div class="mback"></div><div class="mbox">
    <div class="mhead"><span id="m-title"></span><button id="m-close">&times;</button></div>
    <div class="mbody" id="m-body"></div>
    <div class="mfoot" id="m-foot"></div>
  </div></div>
  <script src="/static/lightweight-charts.standalone.production.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
